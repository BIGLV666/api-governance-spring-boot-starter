name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 兼容矩阵（0.7.0 起）：Boot 3.3/3.4/3.5 × JDK 17/21。
        # parent 版本无法用 property 占位，矩阵 job 内以 sed 替换后构建。
        java: [ '17', '21' ]
        boot-version: [ '3.3.13', '3.4.13', '3.5.16' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Pin Spring Boot parent to ${{ matrix.boot-version }}
        run: |
          sed -i "s|<version>3\.5\.16</version>|<version>${{ matrix.boot-version }}</version>|" pom.xml
          grep -A1 "<artifactId>spring-boot-starter-parent</artifactId>" pom.xml
      - name: Start Redis cluster (3 masters, for RedisClusterRateLimiterIntegrationTest)
        run: |
          docker run -d --name governance-redis-cluster \
            -p 7000:7000 -p 7001:7001 -p 7002:7002 \
            -p 17000:17000 -p 17001:17001 -p 17002:17002 \
            redis:7-alpine sh -c 'for i in 0 1 2; do mkdir -p /data/n$i; done;
              redis-server --port 7000 --cluster-enabled yes --cluster-config-file /data/n0/nodes.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --appendonly no --save "" --dir /data/n0 --daemonize yes;
              redis-server --port 7001 --cluster-enabled yes --cluster-config-file /data/n1/nodes.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --appendonly no --save "" --dir /data/n1 --daemonize yes;
              redis-server --port 7002 --cluster-enabled yes --cluster-config-file /data/n2/nodes.conf --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --appendonly no --save "" --dir /data/n2 --daemonize yes;
              sleep infinity'
          for i in $(seq 1 30); do
            if docker exec governance-redis-cluster redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-yes; then
              break
            fi
            sleep 1
          done
          docker exec governance-redis-cluster redis-cli --cluster check 127.0.0.1:7000
      - name: Build & Test (Boot ${{ matrix.boot-version }}, JDK ${{ matrix.java }})
        run: mvn -B test --file pom.xml
      - name: Install to local repo (verify packaging)
        run: mvn -B install -DskipTests -Dgpg.skip=true --file pom.xml
